[package]
name = "parquet-viewer"
version = "0.1.0"
description = "A read-only desktop Parquet viewer"
authors = ["Parquet Viewer contributors"]
edition = "2024"

[lib]
name = "parquet_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
bytes = "1"
parquet = { version = "57.3.1", default-features = false }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
crossbeam-channel = "0.5"
duckdb = { version = "=1.4.2", default-features = false, features = ["bundled", "parquet"] }
sqlparser = { version = "0.59", features = ["visitor"] }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
arrow-array = "57.3.1"
arrow-schema = "57.3.1"
parquet = { version = "57.3.1", features = ["arrow"] }
tauri = { version = "2", features = ["test"] }
tempfile = "3"
filetime = "0.2"
