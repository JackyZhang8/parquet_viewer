name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    strategy:
      fail-fast: true
      matrix:
        # Keep Windows on the same stable MSVC image used by release builds.
        # windows-latest moved to Visual Studio 18/MSVC 14.51, which currently
        # fails to compile the bundled DuckDB 1.4.2 sources.
        os: [macos-latest, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Diagnose Windows loader failures
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found' }
          Get-ChildItem 'src-tauri/target/debug/deps/parquet_viewer_lib-*.exe' | ForEach-Object {
            Write-Host "::group::Imports for $($_.Name)"
            & $dumpbin.FullName /IMPORTS $_.FullName
            Write-Host '::endgroup::'
          }
          $directories = @('src-tauri/target/debug/deps', "$env:WINDIR\System32") + ($env:PATH -split ';')
          $directories | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique | ForEach-Object {
            Get-ChildItem -LiteralPath $_ -Filter '*.dll' -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^(msvcp|vcruntime)' } |
              Select-Object FullName, @{Name='Version'; Expression={$_.VersionInfo.FileVersion}}
          } | Format-Table -AutoSize | Out-String -Width 4096 | Write-Host
      - run: npm test -- --run
      - run: npm run build
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: parquet-viewer-${{ runner.os }}-${{ runner.arch }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
