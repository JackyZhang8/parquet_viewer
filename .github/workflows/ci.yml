name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        # Keep Windows on the same stable MSVC image used by release builds.
        # windows-latest moved to Visual Studio 18/MSVC 14.51, which currently
        # fails to compile the bundled DuckDB 1.4.2 sources.
        os: [macos-latest, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Update Windows C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Bundled DuckDB uses the MSVC C++ runtime. An older runtime can
          # terminate the test executable with STATUS_ENTRYPOINT_NOT_FOUND.
          $installer = Join-Path $env:RUNNER_TEMP 'vc_redist.x64.exe'
          Invoke-WebRequest 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList '/install', '/quiet', '/norestart' -Wait -PassThru
          # 1638: a newer runtime is installed; 3010: installed, reboot requested.
          if ($process.ExitCode -notin @(0, 1638, 3010)) {
            throw "Visual C++ runtime installation failed: $($process.ExitCode)"
          }
          Write-Host "Visual C++ runtime installer exit code: $($process.ExitCode)"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm test -- --run
      - run: npm run build
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: parquet-viewer-${{ runner.os }}-${{ runner.arch }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
