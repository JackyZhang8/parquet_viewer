name: Release GUI

permissions:
  contents: write

on:
  push:
    tags:
      - "parquet-gui-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "GUI version, for example 0.1.0 or v0.1.0"
        required: true
        type: string

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  validate:
    name: Validate GUI version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            raw="$DISPATCH_VERSION"
          else
            raw="$REF_NAME"
            raw="${raw#parquet-gui-}"
          fi

          version="${raw#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=parquet-gui-v$version" >> "$GITHUB_OUTPUT"

      - name: Check project versions
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.version.outputs.version }}"
          tauri_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          npm_version="$(jq -r '.version' package.json)"
          cargo_version="$(awk '
            /^\[package\]$/ { package_section=1; next }
            /^\[/ { package_section=0 }
            package_section && /^version = / {
              gsub(/[" ]/, "", $3)
              print $3
              exit
            }
          ' src-tauri/Cargo.toml)"

          failed=0
          for entry in \
            "src-tauri/tauri.conf.json:$tauri_version" \
            "package.json:$npm_version" \
            "src-tauri/Cargo.toml:$cargo_version"; do
            file="${entry%%:*}"
            actual="${entry#*:}"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$file version is $actual, expected $expected"
              failed=1
            fi
          done
          exit "$failed"

  build:
    name: Build ${{ matrix.artifact_suffix }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact_suffix: macos-arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            artifact_suffix: macos-x86_64
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            artifact_suffix: linux-x86_64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-2022
            artifact_suffix: windows-x86_64
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Validate Apple signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::warning::Apple signing secrets are not set; building an unsigned macOS bundle."
            exit 0
          fi

          missing=0
          for name in APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name must be set when APPLE_CERTIFICATE is configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            exit 0
          fi

          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate_path="$RUNNER_TEMP/apple-certificate.p12"

          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"

          sign_id="$(security find-identity -v -p codesigning "$keychain_path" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$sign_id" ]; then
            echo "::error::APPLE_CERTIFICATE does not contain a Developer ID Application identity."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$sign_id" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build GUI bundles
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          npx tauri build \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}"

      - name: Collect GUI artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          name="parquet-viewer-${version}-${{ matrix.artifact_suffix }}"
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p dist
          found=0

          while IFS= read -r -d '' file; do
            case "$file" in
              *.AppImage) extension="AppImage" ;;
              *.dmg)      extension="dmg" ;;
              *.deb)      extension="deb" ;;
              *.msi)      extension="msi" ;;
              *.exe)      extension="exe" ;;
              *)          continue ;;
            esac
            cp "$file" "dist/${name}.${extension}"
            found=1
          done < <(find "$bundle_dir" -type f \
            \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \
               -o -name "*.msi" -o -name "*.exe" \) -print0)

          if [ "$found" -eq 0 ]; then
            echo "::error::No GUI bundles found under $bundle_dir"
            find "$bundle_dir" -type f || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: parquet-viewer-${{ matrix.artifact_suffix }}
          path: dist/parquet-viewer-*
          if-no-files-found: error

  release:
    name: Publish GUI release
    needs:
      - validate
      - build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag for manual releases
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.validate.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag -a "$tag" -m "Release $tag"
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git push origin "refs/tags/$tag"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find release-assets -type f -print0 | xargs -0 -I{} cp {} dist/
          (cd dist && sha256sum parquet-viewer-* > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Parquet Viewer ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          files: dist/*
